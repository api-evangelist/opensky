  description: >-
    SQL query interface powered by Trino for accessing the full OpenSky historical dataset including state
    vectors, raw Mode S messages, ADS-C and MLAT data, and flight records. Available to university-affiliated
    researchers, governmental organisations, and aviation authorities.
